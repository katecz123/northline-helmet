<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shop helmets — Northline</title><style>*{box-sizing:border-box}body{margin:0;background:#f0efe9;color:#151515;font-family:Arial,Helvetica,sans-serif}.bar{height:76px;padding:0 5vw;display:flex;align-items:center;gap:25px;background:#f0efe9;position:sticky;top:0;z-index:3;border-bottom:1px solid #d7d7d0}.brand{margin-right:auto;color:inherit;text-decoration:none;font-size:22px;font-weight:900;letter-spacing:-2px}.brand span{font-weight:300}.nav{display:flex;gap:25px}.nav a,.bag{border:0;background:none;color:inherit;text-decoration:none;font-size:10px;font-weight:900;letter-spacing:1px}.menu{display:none;border:0;background:none;font-size:10px;font-weight:900;letter-spacing:1px}.page{padding:8vw 5vw}.eyebrow{font-size:10px;letter-spacing:1.5px;font-weight:900}.headline{font-size:clamp(58px,9vw,132px);line-height:.8;letter-spacing:-.09em;margin:20px 0 56px}.headline em{font-family:Georgia,serif;font-weight:400}.filters{display:grid;grid-template-columns:1.7fr 1fr 1fr;gap:9px;border-top:1px solid #a9aaa4;border-bottom:1px solid #a9aaa4;padding:14px 0;margin-bottom:35px}.filters input,.filters select{height:45px;border:1px solid #aeb0a8;background:#fff;padding:0 12px;font:inherit;font-size:12px}.count{font-size:10px;letter-spacing:1px;font-weight:800;margin:0 0 14px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.product{min-width:0}.image{height:36vw;min-height:310px;max-height:500px;background:linear-gradient(#0002,#0002),url('northline-helmet-hero.png') 78% center/cover}.product:nth-child(2) .image{filter:hue-rotate(28deg) saturate(.75)}.product:nth-child(3) .image{filter:grayscale(1) contrast(1.2)}.meta{display:flex;justify-content:space-between;align-items:end;gap:15px;padding:15px 0 26px}.meta p,.meta h2{margin:0}.meta p{font-size:9px;font-weight:900;letter-spacing:1px}.meta h2{font-size:17px;margin-top:6px;letter-spacing:-.7px}.meta strong{white-space:nowrap}.empty{grid-column:1/-1;padding:70px 0;text-align:center;color:#65665f}@media(max-width:700px){.bar{height:62px;padding:0 20px;gap:16px}.menu{display:block}.nav{display:none;position:absolute;top:62px;left:0;right:0;padding:22px;background:#f0efe9;border-bottom:1px solid #d7d7d0;flex-direction:column;align-items:center}.nav.open{display:flex}.page{padding:70px 20px}.headline{margin-bottom:38px}.filters{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.image{height:100vw;min-height:0}.meta{padding-bottom:24px}}</style></head><body><header class="bar"><a class="brand" href="./">NORTH<span>LINE</span></a><button class="menu" id="menu">MENU</button><nav class="nav" id="nav"><a href="./">HOME</a><a href="admin.html">ADMIN</a></nav><span class="bag">BAG</span></header><main class="page"><p class="eyebrow">THE COLLECTION / 2026</p><h1 class="headline">SHOP<br><em>HELMETS.</em></h1><section class="filters"><input id="search" type="search" placeholder="Search helmets"><select id="category"><option value="all">All categories</option><option value="Road">Road / Touring</option><option value="Adventure">Adventure</option><option value="Track">Track</option></select><select id="price"><option value="all">All prices</option><option value="under300">Under $300</option><option value="over300">$300 and above</option></select></section><p class="count" id="count"></p><section class="grid" id="grid"></section></main><script>const products=[{name:'VECTOR ONE',category:'Road',price:289},{name:'TERRA X',category:'Adventure',price:319},{name:'APEX R',category:'Track',price:349}],grid=document.querySelector('#grid'),count=document.querySelector('#count');function render(){const q=search.value.toLowerCase(),c=category.value,p=price.value,items=products.filter(x=>(!q||x.name.toLowerCase().includes(q))&&(c==='all'||x.category===c)&&(p==='all'||p==='under300'&&x.price<300||p==='over300'&&x.price>=300));count.textContent=`${items.length} HELMET${items.length===1?'':'S'} FOUND`;grid.innerHTML=items.length?items.map(x=>`<article class="product"><div class="image" role="img" aria-label="${x.name} helmet"></div><div class="meta"><div><p>${x.category.toUpperCase()} / HELMET</p><h2>${x.name}</h2></div><strong>$${x.price}</strong></div></article>`).join(''):'<p class="empty">No helmets match those filters.</p>'}[search,category,price].forEach(x=>x.addEventListener('input',render));menu.onclick=()=>nav.classList.toggle('open');render()</script></body></html>
